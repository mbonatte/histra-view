[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "histra-python"
version = "1.7.3"
description = "In-process Python solver for HiStrA HRX models"
readme = "README.md"
requires-python = ">=3.12,<3.15"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.0,<2.6",
  "scipy>=1.14,<2.0",
  "numba>=0.67,<0.68",
]

[project.optional-dependencies]
gpu-cu12 = ["nvmath-python[cu12]>=0.9,<2"]
test = ["pytest>=8,<10"]
release = ["build>=1.2,<2", "twine>=6,<7"]
lint = ["ruff>=0.9.0", "mypy>=1.14.0"]
dev = [
  "pytest>=8,<10",
  "build>=1.2,<2",
  "twine>=6,<7",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "pre-commit>=4.0.0",
]

[project.scripts]
histra-article-benchmark = "histra.tools.article_models_benchmark:main"
histra-strategy-benchmark = "histra.tools.strategy_benchmark:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["histra*"]
exclude = ["histra.tests*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["histra/tests"]
markers = [
  "gpu: native CUDA differential tests (skip when cuDSS is unavailable)",
  "integration: regression tests requiring external representative HRX/Results files",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E",     # pycodestyle errors
  "F",     # pyflakes
  "W",     # pycodestyle warnings
]
ignore = [
  "E501",  # line too long (handled by formatter)
  "E402",  # module level import not at top of file
  "E701",  # multiple statements on one line (colon)
  "E702",  # multiple statements on one line (semicolon)
  "E712",  # comparison to True/False
  "E722",  # bare except
  "E731",  # lambda assignment
  "E741",  # ambiguous variable name
  "F401",  # unused import
  "F841",  # local variable unused
  "W291",  # trailing whitespace
  "W293",  # blank line contains whitespace
]

[tool.mypy]
python_version = "3.12"
files = ["histra/model", "histra/__init__.py"]
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_configs = true
warn_redundant_casts = true
